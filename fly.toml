# fly.toml app configuration file generated for riichi-mahjong-rs on 2026-06-13T18:53:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riichi-mahjong-rs'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory on the machine that created them. In multi-machine
  # deployments, `/ws?room=CODE` locates the owner and uses fly-replay so joins
  # and reconnects still reach the right machine.
  #
  # Autostop is safe because machines with active connections stay running.
  # Stopping an idle machine merely drops its unused rooms, matching the old
  # single-machine behavior, while avoiding idle compute costs.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # New connections spill to another machine once this soft limit is reached.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
