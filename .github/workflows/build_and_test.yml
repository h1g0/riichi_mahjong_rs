name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust components and WASM target
      run: |
        rustup component add clippy rustfmt
        rustup target add wasm32-unknown-unknown
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - name: Run tests
      run: cargo test --workspace --all-targets --all-features --locked --verbose
    - name: Check WASM client
      run: cargo check -p mahjong-client --target wasm32-unknown-unknown --release --locked
