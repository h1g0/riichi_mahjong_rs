<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Riichi Mahjong RS</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060e09;
        }
        /* Letterbox the canvas at the window center. */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            /* Keep the canvas loader hidden until this overlay is removed. */
            background: #060e09;
            color: #ece4d2;
            font: 28px/1.2 system-ui, sans-serif;
        }
        .loading-label {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .loading-spinner {
            box-sizing: border-box;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(232, 200, 74, 0.3);
            border-top-color: #e8c84a;
            border-radius: 50%;
            animation: loading-spin 0.8s linear infinite;
        }
        .loading-progress {
            position: relative;
            width: min(320px, 60vw);
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(232, 200, 74, 0.6);
            background: #050e08;
        }
        .loading-progress::after {
            position: absolute;
            inset-block: 0;
            width: 35%;
            content: "";
            background: #c9a227;
            animation: loading-sweep 1.1s ease-in-out infinite alternate;
        }
        #loading[hidden] {
            display: none;
        }
        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes loading-sweep {
            from { left: -35%; }
            to { left: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .loading-spinner, .loading-progress::after { animation: none; }
            .loading-progress::after { left: 32.5%; }
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">
        <div class="loading-label">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading...</span>
        </div>
        <div class="loading-progress" aria-hidden="true"></div>
    </div>
    <canvas id="glcanvas" tabindex='1' width="1280" height="800"></canvas>
    <script>
        // Online server URL. When unset, ws://127.0.0.1:8080/ws (local
        // development) is used; the web build script replaces this.
        // window.MAHJONG_SERVER_URL = "wss://example.com/ws";
    </script>
    <script>
        // Design resolution; must match the client's DESIGN_W/DESIGN_H.
        var MAHJONG_DESIGN_W = 1280;
        var MAHJONG_DESIGN_H = 800;
        // Fit the canvas to the window while keeping the aspect ratio.
        // macroquad sizes its draw buffer to the canvas's
        // clientWidth/clientHeight, so changing the CSS size alone also
        // adjusts the internal resolution.
        function fitMahjongCanvas() {
            var canvas = document.getElementById("glcanvas");
            if (!canvas) return;
            var scale = Math.min(
                window.innerWidth / MAHJONG_DESIGN_W,
                window.innerHeight / MAHJONG_DESIGN_H
            );
            canvas.style.width = Math.round(MAHJONG_DESIGN_W * scale) + "px";
            canvas.style.height = Math.round(MAHJONG_DESIGN_H * scale) + "px";
        }
        // Registering before macroquad sets window.onresize makes this
        // run first on resize, preventing draw-buffer size mismatches.
        window.addEventListener("resize", fitMahjongCanvas);
        fitMahjongCanvas();
    </script>
    <script>
        // Macroquad 0.4.16's bundled quad_net assigns this callback in strict
        // mode without declaring it; keep its registration from throwing (#329).
        var register_plugin;
    </script>
    <script src="mq_js_bundle.js"></script>
    <script src="ws.js"></script>
    <script src="storage.js"></script>
    <script src="loading.js"></script>
    <script>
        if (typeof load === "function") {
            load("mahjong-client.wasm");
        } else {
            document.body.innerHTML = "<p style='color:white;text-align:center;margin-top:40vh'>Error: failed to load mq_js_bundle.js</p>";
        }
    </script>
</body>
</html>
