[package]
name = "mahjong-mjai"
version = "0.1.0"
authors = ["hi_go <me@clutte.red>"]
edition = "2024"

[[bin]]
name = "mjai-bot"
path = "src/bin/mjai_bot.rs"
required-features = ["server"]

[features]
default = ["server"]
# Translation to and from the game server's own protocol. Turning this off
# leaves a dependency-light crate that is just the mjai wire format.
server = ["dep:mahjong-server"]

[dependencies]
mahjong-core = { path = "../mahjong-core" }
mahjong-server = { path = "../mahjong-server", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rstest = "0.26"
strum = "0.28"
