[package]
name = "mahjong-client"
version = "0.1.0"
authors = ["hi_go <me@clutte.red>"]
edition = "2024"

[dependencies]
mahjong-core = { path = "../mahjong-core" }
mahjong-server = { path = "../mahjong-server" }
macroquad = "0.4"
# Bakes tile index labels; macroquad already depends on this crate.
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"

# Native WebSocket client; WASM uses the hand-written JavaScript glue.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Installs rustls's process-default CryptoProvider before wss connections.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
